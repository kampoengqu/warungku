<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cek Histori Belanja</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4">
    <!-- Loader Satset -->
    <div id="initial-loader" class="fixed inset-0 bg-white/95 z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-14 w-14 border-4 border-gray-200 border-t-blue-600 mb-4"></div>
        <h2 class="text-xl font-bold text-gray-800 mb-1">Memuat Histori...</h2>
        <p class="text-gray-500 text-sm">Menarik data dari server</p>
    </div>

    <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md mt-4">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">Cek Histori Belanja Santri</h1>
        <p class="text-center text-gray-500 mb-6 text-sm">Masukkan ID atau Nama Santri untuk melihat detail pembelanjaan.</p>

        <div class="mb-6 relative">
            <div class="flex space-x-2">
                <div class="relative w-full">
                    <input type="text" id="searchInput" autocomplete="off" oninput="handleSearchAutocomplete()" onfocus="handleSearchAutocomplete()" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" placeholder="Ketik ID atau Nama Santri...">
                    <!-- Dropdown Autocomplete -->
                    <ul id="autocomplete-list" class="absolute z-50 w-full bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto hidden custom-scrollbar mt-1"></ul>
                </div>
                <button onclick="searchHistory()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold shadow-md transition-colors">Cari</button>
            </div>
        </div>

        <div id="error-message" class="hidden text-center p-4 bg-red-50 text-red-600 border border-red-200 rounded-lg mb-4 font-medium"></div>

        <div id="results-container" class="hidden space-y-4">
            <!-- Hasil pencarian akan muncul di sini (Otomatis dari yang terbaru) -->
        </div>
    </div>

    <script>
        // --- KONFIGURASI URL (WAJIB DIGANTI!) ---
        // Masukkan URL dari Terapkan > Kelola Deployment > Versi Baru di sini:
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7k_KlFE01YtnrZdX038uFuqlVO53WttS-LqedpaiAEStCNUglng8YpUXdfYxGGlSj/exec";

        let allHistoryData = [];

        async function initApp() {
            if (APPS_SCRIPT_URL.includes("GANTI_DENGAN")) {
                showError("Konfigurasi Error: Anda belum menempelkan URL Web App Anda di dalam file cekhistori/index.html");
                return;
            }

            // 1. Coba baca dari memori (Cache) dulu agar SATSET
            const cachedData = localStorage.getItem('kantin_history');
            if (cachedData) {
                allHistoryData = JSON.parse(cachedData);
                hideLoader();
                fetchDataBackground(); // Update data diam-diam di latar belakang
            } else {
                await fetchDataForeground(); // Jika memori kosong, tunggu loading
            }
        }

        async function fetchDataForeground() {
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getdata');
                if (!response.ok) throw new Error("Gagal terhubung ke server.");
                const data = await response.json();
                
                // Balik urutan array agar transaksi terbaru berada di atas!
                allHistoryData = data.reverse();
                localStorage.setItem('kantin_history', JSON.stringify(allHistoryData));
                hideLoader();
            } catch (err) {
                showError("Gagal memuat data awal. Pastikan URL Apps Script benar dan tidak ada salah ketik.");
            }
        }

        async function fetchDataBackground() {
            try {
                const response = await fetch(APPS_SCRIPT_URL + '?action=getdata');
                const data = await response.json();
                allHistoryData = data.reverse();
                localStorage.setItem('kantin_history', JSON.stringify(allHistoryData));
            } catch (err) {
                console.error("Gagal update background:", err);
            }
        }

        function hideLoader() {
            const loader = document.getElementById('initial-loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.classList.add('hidden'), 300);
        }

        function showError(msg) {
            document.getElementById('initial-loader').classList.add('hidden');
            const errEl = document.getElementById('error-message');
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
        }

        // --- AUTOCOMPLETE CERDAS ---
        function handleSearchAutocomplete() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const listEl = document.getElementById('autocomplete-list');
            listEl.innerHTML = '';

            if (!input) {
                listEl.classList.add('hidden');
                return;
            }

            // Ekstrak daftar nama/ID unik dari seluruh histori
            const uniqueSantri = [];
            const seenIds = new Set();
            
            for (const row of allHistoryData) {
                if (row.ID_Santri && !seenIds.has(row.ID_Santri)) {
                    seenIds.add(row.ID_Santri);
                    uniqueSantri.push({ id: String(row.ID_Santri), name: String(row.Nama_Santri) });
                }
            }

            const matches = uniqueSantri.filter(s => 
                s.id.toLowerCase().includes(input) || s.name.toLowerCase().includes(input)
            ).slice(0, 8); // Tampilkan 8 saran terbaik

            if (matches.length > 0) {
                matches.forEach(student => {
                    const li = document.createElement('li');
                    li.className = 'px-4 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0';
                    li.innerHTML = `<div class="font-semibold text-gray-800">${student.name}</div><div class="text-xs text-gray-500">ID: ${student.id}</div>`;
                    li.onclick = () => {
                        document.getElementById('searchInput').value = student.id;
                        listEl.classList.add('hidden');
                        searchHistory(); // Langsung eksekusi pencarian
                    };
                    listEl.appendChild(li);
                });
                listEl.classList.remove('hidden');
            } else {
                listEl.classList.add('hidden');
            }
        }

        // Tutup dropdown jika area lain diklik
        document.addEventListener('click', function(e) {
            if (!e.target.closest('#searchInput')) {
                document.getElementById('autocomplete-list').classList.add('hidden');
            }
        });

        // --- PENCARIAN & RENDER HASIL ---
        function searchHistory() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const resultsContainer = document.getElementById('results-container');
            const errEl = document.getElementById('error-message');
            
            errEl.classList.add('hidden');
            resultsContainer.innerHTML = '';
            resultsContainer.classList.remove('hidden');

            if (!query) {
                showError("Silakan ketikkan ID atau Nama Santri terlebih dahulu.");
                return;
            }

            // Cari histori yang cocok
            const results = allHistoryData.filter(row => 
                String(row.ID_Santri).toLowerCase() === query || 
                String(row.Nama_Santri).toLowerCase() === query
            );

            if (results.length === 0) {
                resultsContainer.innerHTML = `<div class="text-center p-8 bg-gray-50 border border-dashed border-gray-300 rounded-xl text-gray-500">Tidak ada histori belanja untuk santri tersebut.</div>`;
                return;
            }

            // Render Kartu Histori yang rapi
            results.forEach(row => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:shadow-md transition-shadow';
                
                // Format Tanggal jadi rapi (Contoh: 11 Agustus 2026)
                const dateObj = new Date(row.Timestamp);
                const dateStr = dateObj.toLocaleDateString('id-ID', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                // Ubah data JSON belanjaan menjadi list HTML
                let detailHTML = '';
                try {
                    const details = JSON.parse(row.Detail_Belanja_JSON);
                    detailHTML = `<ul class="mt-3 space-y-2 bg-gray-50 p-4 rounded-lg border border-gray-100">`;
                    details.forEach(item => {
                        detailHTML += `<li class="flex justify-between text-sm text-gray-700">
                                          <span><strong class="text-gray-900">${item.jumlah}x</strong> ${item.nama}</span> 
                                          <span class="font-medium text-gray-800">Rp ${(item.harga * item.jumlah).toLocaleString('id-ID')}</span>
                                       </li>`;
                    });
                    detailHTML += `</ul>`;
                } catch(e) {
                    detailHTML = `<p class="text-sm text-red-400 italic mt-2">Detail barang tidak dapat dibaca.</p>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start border-b border-gray-100 pb-3 mb-3">
                        <div>
                            <div class="font-bold text-gray-800 text-lg">${row.Nama_Santri}</div>
                            <div class="text-xs text-gray-500 mt-1"><span class="bg-gray-100 px-2 py-1 rounded">ID: ${row.ID_Santri}</span> &nbsp;|&nbsp; 🕒 ${dateStr}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-gray-400 uppercase tracking-wider font-bold mb-1">Total Belanja</div>
                            <div class="font-bold text-blue-600 text-xl">Rp ${Number(row.Total_Belanja).toLocaleString('id-ID')}</div>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 mt-4">Rincian Barang:</div>
                        ${detailHTML}
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // Eksekusi initApp saat layar siap
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
